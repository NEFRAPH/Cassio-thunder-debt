
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cassio — Thunder Debt</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  background: #15121d;
  color: #f4efff;
  font-family: Arial, sans-serif;
}
.tracker {
  max-width: 650px;
  margin: auto;
  padding: 22px;
  background: #211a30;
  border: 1px solid #49365f;
  border-radius: 16px;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
h2 {
  margin: 0;
  color: #dec8ff;
  font-size: 18px;
  letter-spacing: 2px;
}
#state {
  color: #b99af0;
  font-size: 12px;
  font-weight: bold;
}
.amount {
  margin-top: 22px;
  font-size: 40px;
  font-weight: bold;
}
.amount small {
  font-size: 15px;
  color: #a99fbb;
}
.bar {
  height: 15px;
  margin: 16px 0 8px;
  background: #3b334b;
  border-radius: 20px;
  overflow: hidden;
}
#fill {
  width: 0%;
  height: 100%;
  background: #a37bf0;
  border-radius: 20px;
  transition: width .2s;
}
.labels {
  display: flex;
  justify-content: space-between;
  color: #a99fbb;
  font-size: 11px;
}
.buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin-top: 24px;
}
button {
  padding: 12px 5px;
  background: #30283e;
  color: white;
  border: 1px solid #57476e;
  border-radius: 9px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}
button:hover { filter: brightness(1.2); }
.plus { background: #6744a8; }
.reset {
  width: 100%;
  margin-top: 10px;
}
</style>
</head>
<body>
<div class="tracker">
  <div class="header">
    <h2>⚡ THUNDER DEBT</h2>
    <span id="state">NORMAL</span>
  </div>

  <div class="amount">
    <span id="charge">0</span>
    <small>/ 150 CHARGE</small>
  </div>

  <div class="bar">
    <div id="fill"></div>
  </div>

  <div class="labels">
    <span>0</span><span>25</span><span>50</span>
    <span>75</span><span>100</span><span>150</span>
  </div>

  <div class="buttons">
    <button onclick="change(-25)">−25</button>
    <button onclick="change(-10)">−10</button>
    <button onclick="change(-5)">−5</button>
    <button class="plus" onclick="change(5)">+5</button>
    <button class="plus" onclick="change(10)">+10</button>
    <button class="plus" onclick="change(25)">+25</button>
  </div>

  <button class="reset" onclick="resetCharge()">
    ↺ Reset Charge
  </button>
</div>

<script>
const storageKey = "cassio-charge";
let charge = 0;

try {
  charge = Number(localStorage.getItem(storageKey)) || 0;
} catch (e) {}

charge = Math.max(0, Math.min(150, charge));

function change(amount) {
  charge = Math.max(0, Math.min(150, charge + amount));
  update();
}

function resetCharge() {
  charge = 0;
  update();
}

function update() {
  document.getElementById("charge").textContent = charge;
  document.getElementById("fill").style.width =
    (charge / 150 * 100) + "%";

  let state = "NORMAL";
  let color = "#8f91a5";

  if (charge >= 100) {
    state = "REDLINE";
    color = "#e45c75";
  } else if (charge >= 75) {
    state = "OVERCHARGE";
    color = "#ee955c";
  } else if (charge >= 50) {
    state = "SURGE";
    color = "#d7b35f";
  } else if (charge >= 25) {
    state = "STATIC";
    color = "#a37bf0";
  }

  document.getElementById("state").textContent = state;
  document.getElementById("state").style.color = color;
  document.getElementById("fill").style.background = color;

  try {
    localStorage.setItem(storageKey, charge);
  } catch (e) {}
}

update();
</script>
</body>
</html>
